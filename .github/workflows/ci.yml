
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Reproduce sample pipeline and compare exports
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="$(mktemp -d)"
          trap 'rm -rf "$RUN_DIR"' EXIT

          mkdir -p "$RUN_DIR/output"
          mkdir -p "$RUN_DIR/expected"

          dedup run \
            --input data/sample/customers_sample.csv \
            --db "$RUN_DIR/sample.sqlite" \
            --config config/default.toml

          dedup report \
            --db "$RUN_DIR/sample.sqlite" \
            --out "$RUN_DIR/report.txt" \
            --export-dir "$RUN_DIR/output"

          cp data/sample/output/*.csv "$RUN_DIR/expected/"

          diff -r "$RUN_DIR/output" "$RUN_DIR/expected"
