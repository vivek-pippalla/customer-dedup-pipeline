[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-dedup-pipeline"
version = "0.1.0"
description = "Deterministic customer duplicate detection pipeline"
requires-python = ">=3.11"
dependencies = ["rapidfuzz>=3.14.6"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
dedup = "dedup.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dedup = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
